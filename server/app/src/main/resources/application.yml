server:
  port: ${PORT:8080}
  shutdown: graceful
spring:
  application:
    name: spatialdesk
  lifecycle:
    timeout-per-shutdown-phase: 20s
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
spatialdesk:
  # Each judge gets an anonymous session; caps protect the server and the bill (ScreenDesk lesson).
  sessions:
    max-active: 500
    per-ip-per-hour: 30
  # The planning agent: Amazon Nova on Bedrock with forced tool use; every plan is validated by the shared
  # engine before the headset sees it. Quotas bound the Bedrock bill for the whole competition.
  agent:
    mode: ${SPATIALDESK_AGENT_MODE:bedrock}
    model: ${SPATIALDESK_AGENT_MODEL:us.amazon.nova-2-lite-v1:0}
    region: us-east-1
    per-session-per-hour: 20
    per-day: 300
    # The headset gives the whole request 7 s (src/backend/resilience.ts): a stalled Nova is cut at 6 s so the built-in
    # planner's answer still arrives in time, instead of the headset giving up first.
    timeout-seconds: 6
  # Voice commands: the headset streams its microphone straight to Amazon Transcribe over a URL this server presigns
  # (no audio passes through here). Each listen is a few seconds; the caps bound the Transcribe bill.
  voice:
    enabled: ${SPATIALDESK_VOICE_ENABLED:true}
    region: us-east-1
    per-session-per-hour: 60
    per-day: 600
    expires-seconds: 30
